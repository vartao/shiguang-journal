server:
  port: 8080

spring:
  application:
    name: qinglv-note
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/qinglv_note?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发时可改为 org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置（Docker 可用 JWT_SECRET 覆盖）
jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000  # 7天，单位毫秒

# CORS跨域配置（生产请用环境变量 CORS_ORIGINS 覆盖，逗号分隔）
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8090}
  # 阿里云 OSS（可选）。配置完整时上传走 OSS，否则回退本地磁盘
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    bucket: ${ALIYUN_OSS_BUCKET:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    public-base-url: ${ALIYUN_OSS_PUBLIC_BASE_URL:}
    key-prefix: ${ALIYUN_OSS_KEY_PREFIX:qinglv/}

# 文件上传配置
file:
  upload-path: ${FILE_UPLOAD_PATH:./uploads/}
  access-prefix: /uploads/
  allowed-types: jpg,jpeg,png,gif,webp,bmp,mp4,mp3,pdf,txt
  max-size: 20971520  # 20MB
  # 上传资源签名密钥（默认复用 JWT_SECRET，生产可独立配置 FILE_SIGN_KEY）
  sign-key: ${FILE_SIGN_KEY:${jwt.secret}}
  # 签名 URL 有效期（天）；浏览器侧配合 30 天 immutable 缓存
  url-ttl-days: 30

# API文档
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
