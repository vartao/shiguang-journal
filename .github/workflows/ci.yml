name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 校验两份 schema.sql 一致（对应 scripts/verify.sh 中的 cmp 检查）
  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 比对 sql/schema.sql 与 backend 副本
        run: cmp sql/schema.sql backend/src/main/resources/schema.sql

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: lint + format + 单元测试
        run: npm run check
      - name: 构建
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: 单元/契约测试
        run: mvn -B test
